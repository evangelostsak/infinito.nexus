---
# nocheck: required-by-coverage
# nocheck: dynamic-flag  WireGuard is mandatory for every swarm deploy and svc-swarm-node exists only in one, so a group-gated flag would describe a state the deploy must never reach
wireguard:
  enabled: true
  shared: true
  bond: 1
node:
  modes:
    host:
      enabled: true
  name: swarm
  lifecycle: beta
  bond: 1
  run_after:
    - svc-net-wireguard
  enabled: true
  shared: true
  min_storage: "100MB"
  cpus: "0.1"
  mem_reservation: "32m"
  mem_limit: "128m"
  pids_limit: 256
