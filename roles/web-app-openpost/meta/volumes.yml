---
media:
  type: volume
  name: openpost_media
  mounts:
    - service: openpost
      target: /data/media

simulator_mappings:
  type: config
  source: "{{ [lookup('container', 'web-app-openpost', 'directories.config'), 'simulator', 'openpost.json'] | path_join }}"
  mode: "0444"
  mounts:
    - service: simulator
      target: /home/wiremock/mappings/openpost.json
      when: "{{ lookup('config', 'web-app-openpost', 'services.simulator.enabled') | bool }}"

simulator_keystore:
  type: secret
  source: "{{ [lookup('container', 'web-app-openpost', 'directories.config'), 'simulator', 'keystore.p12'] | path_join }}"
  mode: "0400"
  mounts:
    - service: simulator
      target: /home/wiremock/keystore.p12
      when: "{{ lookup('config', 'web-app-openpost', 'services.simulator.enabled') | bool }}"

simulator_ca:
  type: config
  source: "{{ [lookup('container', 'web-app-openpost', 'directories.config'), 'simulator', 'ca.crt'] | path_join }}"
  mode: "0444"
  mounts:
    - service: openpost
      target: /etc/ssl/openpost-simulator/ca.crt
      when: "{{ lookup('config', 'web-app-openpost', 'services.simulator.enabled') | bool }}"

crossposter_config:
  type: config
  source: "{{ [lookup('container', 'web-app-openpost', 'directories.config'), 'crossposter', 'crossposter.json'] | path_join }}"
  mode: "0444"
  mounts:
    - service: crossposter
      target: /config/crossposter.json
      when: "{{ (lookup('config', 'web-app-openpost', 'services.crossposter.enabled') | bool) and (lookup('config', 'web-app-openpost', 'services.crossposter.routes') | length) > 0 }}"

crossposter_secrets:
  type: secret
  source: "{{ [lookup('container', 'web-app-openpost', 'directories.config'), 'crossposter', 'crossposter-secrets.json'] | path_join }}"
  mode: "0400"
  mounts:
    - service: crossposter
      target: /run/secrets/crossposter.json
      when: "{{ (lookup('config', 'web-app-openpost', 'services.crossposter.enabled') | bool) and (lookup('config', 'web-app-openpost', 'services.crossposter.routes') | length) > 0 }}"

relay_conf:
  type: config
  source: "{{ [lookup('container', 'web-app-openpost', 'directories.config'), 'relay.conf'] | path_join }}"
  mode: "0444"
  mounts:
    - service: relay
      target: /etc/nginx/nginx.conf
