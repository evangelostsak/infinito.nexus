    matomo:
      enabled: false
      shared: false
    peertube:
      enabled: true
      shared: true
    pixelfed:
      enabled: true
      shared: true
    postgres:
      shared: true
    prometheus:
      enabled: false
      shared: false
    seaweedfs:
      enabled: false
      shared: false
    sso:
      enabled: false
      shared: false
    tor:
      enabled: true

- services:
