---
# nocheck: clearnet-variant-tor  PeerTube is a publishing target OpenPost reaches server-side through its relay; the onion round never advertises it
- services:
    container_backup:
      enabled: true
    css:
      enabled: true
      shared: true
    dashboard:
      enabled: true
      shared: true
    email:
      enabled: true
      shared: true
    logout:
      enabled: true
      shared: true
    mastodon:
      enabled: true
      shared: true
    matomo:
      enabled: true
      shared: true
    peertube:
      enabled: false
      shared: false
    pixelfed:
      enabled: false
      shared: false
    postgres:
      shared: true
    prometheus:
      enabled: true
      shared: true
    seaweedfs:
      enabled: true
      shared: true
    simulator:
      enabled: true # nocheck: variants-static-override  CI provider simulator that only this round switches on
    sso:
      enabled: true
      shared: true
    tor:
      enabled: true

- services:
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
