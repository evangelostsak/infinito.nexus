---
- name: "🔎 List the accounts connected in the organisation workspace"
  uri_retry:
    url: "{{ OPENPOST_LOCAL_URL }}/api/v1/accounts?workspace_id={{ openpost_crossposter_target_workspace }}"
    headers: "{{ openpost_breakglass_headers }}"
    status_code: 200
  register: openpost_crossposter_connected
  changed_when: false
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🔗 Connect the CI Mastodon account as a crossposting target"
  when: openpost_crossposter_connected.json | selectattr('platform', 'equalto', 'mastodon') | list | length == 0
  block:
    - name: "🔍 Resolve the Mastodon container that grants the OpenPost app"
      ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
      vars:
        resolve_service_key: mastodon
        resolve_service_name: "{{ lookup('container_service', 'web-app-mastodon', 'mastodon') if DEPLOYMENT_MODE == 'swarm' else '' }}"
        resolve_output_prefix: OPENPOST_SEED_MASTODON
        resolve_compose_cid: "{{ lookup('container_address', 'web-app-mastodon', 'mastodon') }}"

    - name: "🎫 Grant OpenPost's pinned app an authorization code for the CI account"
      ansible.builtin.command:
        argv:
          - container
          - exec
          - -e
          - "CROSSPOSTER_ACCOUNT={{ openpost_crossposter_mastodon_route.source.account }}"
          - -e
          - "CROSSPOSTER_CLIENT_ID={{ openpost_fediverse_apps[openpost_crossposter_mastodon_route.source.base_url].client_id }}"
          - "{{ OPENPOST_SEED_MASTODON_LOCAL_CID }}" # nocheck: container-exec-resolver  OPENPOST_SEED_MASTODON_LOCAL_CID resolved at delegate_to runtime
          - bin/rails
          - runner
          - |
            account = Account.find_local!(ENV.fetch("CROSSPOSTER_ACCOUNT"))
            application = Doorkeeper::Application.find_by!(uid: ENV.fetch("CROSSPOSTER_CLIENT_ID"))
            grant = Doorkeeper::AccessGrant.create!(application: application, resource_owner_id: account.user.id, redirect_uri: "urn:ietf:wg:oauth:2.0:oob", scopes: application.scopes.to_s, expires_in: 600)
            puts "CROSSPOSTER_GRANT=#{grant.plaintext_token}"
      register: openpost_crossposter_mastodon_grant
      changed_when: true
      delegate_to: "{{ OPENPOST_SEED_MASTODON_HOST_NODE }}"
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

    - name: "🔁 Exchange the code through OpenPost"
      uri_retry:
        url: "{{ OPENPOST_LOCAL_URL }}/api/v1/accounts/mastodon/exchange"
        method: POST
        headers: "{{ openpost_breakglass_headers }}"
        body_format: json
        body:
          code: "{{ (openpost_crossposter_mastodon_grant.stdout_lines | select('match', 'CROSSPOSTER_GRANT=') | first) | replace('CROSSPOSTER_GRANT=', '') | trim }}"
          instance_url: "{{ openpost_crossposter_mastodon_route.source.base_url }}"
          server_name: "{{ openpost_crossposter_mastodon_route.source.base_url }}"
          workspace_id: "{{ openpost_crossposter_target_workspace }}"
        status_code: [200, 201]
      changed_when: true
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  vars:
    openpost_crossposter_mastodon_route: "{{ OPENPOST_CROSSPOSTER_ROUTES | selectattr('source.platform', 'equalto', 'mastodon') | first }}"
