---
application_id: "svc-net-wireguard"

WIREGUARD_CONFIG_DIR: "/etc/wireguard"

# Rationale: probed by path rather than by `command -v`, which is a shell
# builtin the command module cannot exec and therefore reports missing on every
# host. wireguard-tools installs here on every distro this role supports.
WIREGUARD_QUICK_BINARY: "/usr/bin/wg-quick"

# Rationale: the meshes this host belongs to, already resolved by
# cli.administration.inventory.mesh. The role never plans a mesh; it renders
# what the inventory was handed, so a host can only configure peers the single
# cross-host writer agreed on.
WIREGUARD_HOST_MESHES: "{{ lookup('config', application_id, 'meshes', {}) }}"

WIREGUARD_MESH_NAMES: "{{ WIREGUARD_HOST_MESHES.keys() | list | sort }}"

# Rationale: one literal lookup per declared mesh. A single lookup built from
# the loop variable would be a dynamic config path, which the lookup validator
# cannot resolve and therefore cannot prove correct before a deploy.
WIREGUARD_PRIVATE_KEYS:
  swarm: "{{ lookup('config', application_id, 'secrets.credentials.mesh_private_key_swarm', '') }}"
  data: "{{ lookup('config', application_id, 'secrets.credentials.mesh_private_key_data', '') }}"

# Rationale: the hub is the only member with peers in both planes, so it is the
# only host that has to forward between them.
WIREGUARD_IS_HUB: >-
  {{ WIREGUARD_HOST_MESHES.values() | map(attribute='is_hub') | select | list | length > 0 }}

WIREGUARD_EXPECTED_PEERS: >-
  {{ WIREGUARD_HOST_MESHES.values()
     | map(attribute='peers')
     | flatten
     | map(attribute='address')
     | list }}
