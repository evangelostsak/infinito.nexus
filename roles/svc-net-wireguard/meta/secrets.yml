---
credentials:
  mesh_private_key_swarm:
    description: Curve25519 private key of this host in the swarm mesh, minted by cli.administration.inventory.mesh rather than by the per-host credential
      generator, because its public half has to appear in a different host's peer list. Declared plain so the generator leaves it to that cross-host pass.
    algorithm: plain
    validation: non_empty_string
  mesh_private_key_data:
    description: Curve25519 private key of this host in the data mesh, minted by cli.administration.inventory.mesh. Only the manager, the NFS server and the
      backup host are members, so on a worker this credential stays unset.
    algorithm: plain
    validation: non_empty_string
