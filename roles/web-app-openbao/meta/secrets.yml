---
credentials:
  seal_key:
    description: 32-byte AES-256-GCM-96 key for the OpenBao static seal, injected as env://OPENBAO_SEAL_KEY. Every backup of the raft volume is undecryptable
      without it; its authoritative home is the encrypted inventory.
    algorithm: random_hex_32
    validation: non_empty_string
  approle_role_id:
    description: RoleID of the Ansible AppRole, written to auth/approle/role/ansible/role-id at bootstrap so later deploys authenticate without a stored root
      token.
    algorithm: alphanumeric
    validation: non_empty_string
  approle_secret_id:
    description: SecretID of the Ansible AppRole, written to auth/approle/role/ansible/custom-secret-id at bootstrap.
    algorithm: alphanumeric
    validation: non_empty_string
  rbac_operator_password:
    description: Local password of the role-internal `baooperator` user, whose only RBAC role is `operator`. It backs the LDAP-bind login the RBAC tier spec
      drives. Declared here rather than left to the users fallback because a user without an explicit password inherits the strong_password fallback expression,
      which is regenerated on every render, so the value written to LDAP and the value handed to the test differ and the bind returns 403. Alphanumeric for the
      same reason as web-app-zammad's api_bot_password.
    algorithm: alphanumeric
    validation: "^[A-Za-z0-9]{32,}$"
    length: 48
  rbac_reader_password:
    description: Local password of the role-internal `baoreader` user, whose only RBAC role is `reader`. Same rationale as rbac_operator_password.
    algorithm: alphanumeric
    validation: "^[A-Za-z0-9]{32,}$"
    length: 48
